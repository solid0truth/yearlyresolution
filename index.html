<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Resolution Mindmap</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>2026 Resolution</h1>
            <p style="color: #6e6e73; margin-top: 5px;">연간 계획 마인드맵</p>
            <div style="margin-top: 10px; padding: 10px; background: #f5f5f7; border-radius: 6px; font-size: 12px; color: #6e6e73;">
                <strong>키보드 단축키:</strong>
                ↑↓ 이동 | ←→ 접기/펼치기 | Shift+←→ 레벨 조정 | Tab 하위 추가 | Enter 동등 레벨 추가 | Space 이름 수정 | D 상세보기 | Backspace 삭제
            </div>
        </header>

        <div class="dashboard">
            <div class="card">
                <h3>Weekly Time Budget</h3>
                <div class="stat" id="totalTime">0h/w</div>
                <div class="sub-stat" id="timeStatus">Available: 168h/w</div>
            </div>
            <div class="card">
                <h3>Weekly Money Budget</h3>
                <div class="stat" id="totalMoney">0원/w</div>
                <div class="sub-stat" id="moneyStatus">-</div>
            </div>
            <div class="card">
                <h3>Book Budget</h3>
                <div class="stat" id="totalBook">0권</div>
                <div class="sub-stat" id="bookStatus">-</div>
            </div>
        </div>

        <div class="mindmap" id="mindmap">
            <!-- Nodes will be generated here -->
        </div>

        <div class="actions">
            <button onclick="showAddNodeDialog()">+ Add Node</button>
            <button class="secondary" onclick="loadExample()">📖 Load Example</button>
            <button class="secondary" onclick="exportCSV()">Export CSV</button>
            <button class="secondary" onclick="manualSave()">Save</button>
            <button class="secondary" onclick="loadFromCSV()">Import CSV</button>
        </div>

        <!-- Add Node Dialog -->
        <div id="addNodeDialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: white; padding: 30px; border-radius: 12px; max-width: 500px; width: 90%;">
                <h2 style="margin-bottom: 20px;">Add New Node</h2>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Title *</label>
                        <input type="text" id="newNodeTitle" style="width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 6px;" placeholder="Enter node title">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Level *</label>
                        <select id="newNodeLevel" style="width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 6px;">
                            <option value="L1">L1</option>
                            <option value="L2">L2</option>
                            <option value="L3">L3</option>
                            <option value="L4">L4</option>
                            <option value="L5">L5</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Parent Node</label>
                        <select id="newNodeParent" style="width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 6px;">
                            <option value="">None (Root)</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button onclick="createNode()" style="flex: 1; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Create</button>
                        <button onclick="closeAddNodeDialog()" style="flex: 1; padding: 12px; background: #f5f5f7; color: #1d1d1f; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
